version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pm_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pm_network

  postgres:
    image: postgres:15-alpine
    container_name: pm_postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pm_network

  mongodb:
    image: mongo:latest
    container_name: pm_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pm_network

  api-gateaway:
    build:
      context: ./api-gateaway
      dockerfile: Dockerfile
    container_name: pm_api_gateaway
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@pm_postgres:5432/${POSTGRES_DB}?schema=public
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@pm_mongodb:27017/predictive_maintenance?authSource=admin
      - RABBITMQ_URL=amqp://${RABBIT_USER}:${RABBIT_PASS}@pm_rabbitmq:5672
    networks:
      - pm_network

volumes:
  rabbitmq_data:
  postgres_data:
  mongo_data:

networks:
  pm_network:
    driver: bridge
